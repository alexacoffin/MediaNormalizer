services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "${MEDIA_NORMALIZER_DB_PID:-Developer}"
      MSSQL_SA_PASSWORD: "${MEDIA_NORMALIZER_DB_SA_PASSWORD:?Set MEDIA_NORMALIZER_DB_SA_PASSWORD in .env}"
    ports:
      - "127.0.0.1:${MEDIA_NORMALIZER_DB_PORT:-11433}:1433"
    volumes:
      - media-normalizer-db-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/1433'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  db-init:
    build:
      context: .
      dockerfile: Database/Deploy.Dockerfile
    environment:
      DB_NAME: MediaNormalizer
      DB_PORT: "1433"
      DB_SERVER: db
      MSSQL_SA_PASSWORD: "${MEDIA_NORMALIZER_DB_SA_PASSWORD:?Set MEDIA_NORMALIZER_DB_SA_PASSWORD in .env}"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  media-normalizer:
    build:
      context: .
      dockerfile: Dockerfile
    image: media-normalizer:latest
    restart: unless-stopped
    depends_on:
      db-init:
        condition: service_completed_successfully
    ports:
      - "${MEDIA_NORMALIZER_PORT:-18081}:18081"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "18081"
      Omdb__ApiKey: "${OMDB_API_KEY:?Set OMDB_API_KEY in .env}"
      MediaLibrary__Locations__0: /media/library
      MediaLibrary__MediaTypes__0__Id: Tv
      MediaLibrary__MediaTypes__0__Name: TV
      MediaLibrary__MediaTypes__0__Subdirectory: TV
      MediaLibrary__MediaTypes__0__OutputDirectory: /media/normalized
      MediaLibrary__MediaTypes__0__Enabled: "${MEDIA_LIBRARY_TV_ENABLED:-false}"
    volumes:
      - type: bind
        source: ${MEDIA_LIBRARY_PATH:?Set MEDIA_LIBRARY_PATH in .env}
        target: /media/library
      - type: bind
        source: ${MEDIA_NORMALIZED_PATH:?Set MEDIA_NORMALIZED_PATH in .env}
        target: /media/normalized
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:18081/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  media-normalizer-db-data:
